server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true              # http://localhost:8083/h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Where the other services live (used by the Feign clients).
# Hardcoded on purpose - Phase 3 (Eureka) removes these URLs.
clients:
  book-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082
