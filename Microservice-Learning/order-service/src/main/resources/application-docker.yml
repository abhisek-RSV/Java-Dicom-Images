# Loaded ONLY when the 'docker' profile is active (SPRING_PROFILES_ACTIVE=docker).
# Values here override application.yml -> H2 is replaced by PostgreSQL.
#
# "order-db" is the Postgres container name from docker-compose.yml;
# inside the Docker network, container names work as hostnames.
spring:
  datasource:
    url: jdbc:postgresql://order-db:5432/orderdb
    username: order_app
    password: order_pass
  h2:
    console:
      enabled: false
