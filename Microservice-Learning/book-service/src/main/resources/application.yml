server:
  port: 8081

spring:
  application:
    name: book-service
  datasource:
    url: jdbc:h2:mem:bookdb      # each service owns its own database
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true              # http://localhost:8081/h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
